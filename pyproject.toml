[project]
name = "pulse-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "redis[hiredis]>=5,<7",
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.30,<1",
  "email-validator>=2,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "pwdlib[argon2,bcrypt]>=0.2,<1",
  "pyjwt>=2.9,<3",
  "aiofiles>=24.1",
  "python-multipart>=0.0.18",
  "websockets>=14",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.13,<2", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["unit: pruebas unitarias", "integration: PostgreSQL y Redis reales", "e2e: flujos completos"]

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

